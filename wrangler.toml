name = "magic-resume"
main = "dist/server/server.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"

# Optional: bind a Cloudflare D1 database named DB to persist interview-prep history.
# Create one with:
#   pnpm wrangler d1 create magic-resume-prep
# Then paste the returned database_id below and remove the comment marks.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "magic-resume-prep"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
